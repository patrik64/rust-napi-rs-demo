[package]
name = "demo_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pulldown-cmark = "0.13"

[build-dependencies]
# =2.3.2: napi-build 2.4 links against the emnapi v2 (alpha) symbol scheme,
# which needs @napi-rs/cli 3.8 + emnapi@2.0.0-alpha; we stay on stable emnapi 1.x.
napi-build = "=2.3.2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
